name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  schedule:
    - cron: '0 6 * * 1'   # toda segunda: recompila com o yt-dlp mais recente

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt pyinstaller

      - name: Baixar FFmpeg e Deno
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin, tmp | Out-Null
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile tmp\ffmpeg.zip
          Expand-Archive tmp\ffmpeg.zip -DestinationPath tmp\ffmpeg
          Get-ChildItem tmp\ffmpeg -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination bin
          Invoke-WebRequest "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile tmp\deno.zip
          Expand-Archive tmp\deno.zip -DestinationPath bin
          Get-ChildItem bin

      - name: Gerar o .exe
        shell: pwsh
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name BaixadorDeVideos
          --icon assets\icon.ico
          --paths src
          --add-data "assets\icon.ico;assets"
          --add-data "bin\ffmpeg.exe;."
          --add-data "bin\ffprobe.exe;."
          --add-data "bin\deno.exe;."
          --collect-all customtkinter
          --collect-all yt_dlp
          --collect-all yt_dlp_ejs
          src\app.py

      - uses: actions/upload-artifact@v4
        with:
          name: BaixadorDeVideos-windows
          path: dist/BaixadorDeVideos.exe

      - name: Publicar Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v" + (Get-Date -Format "yyyy.MM.dd") + "-" + $env:GITHUB_RUN_NUMBER
          gh release create $tag dist\BaixadorDeVideos.exe --title "Baixador de Videos $tag" --notes "Executavel portatil para Windows. Baixe o BaixadorDeVideos.exe e de dois cliques." --target $env:GITHUB_SHA
